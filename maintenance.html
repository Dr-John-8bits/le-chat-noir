<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Maintenance — Le Chat Noir</title>
    <meta name="description" content="Le site du Chat Noir est momentanément en maintenance. L'antenne continue et le flux reste écoutable." />
    <meta name="theme-color" content="#08122b" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#08122b" media="(prefers-color-scheme: dark)" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/shell.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <script type="module">
      import { REFRESH_MS } from "./assets/js/config.js";
      import { fetchNowPlaying, fetchCurrentShow, STATUS } from "./assets/js/radio-api.js";
      import { createPoller } from "./assets/js/poller.js";
      import { setTextIfChanged } from "./assets/js/ui-states.js";

      async function refresh() {
        const [showResult, trackResult] = await Promise.all([fetchCurrentShow(), fetchNowPlaying()]);
        if (showResult.status === STATUS.OK) {
          setTextIfChanged(document.getElementById("mShow"), showResult.data.show || "Programmation en cours");
        }
        if (trackResult.status === STATUS.OK) {
          const t = trackResult.data;
          setTextIfChanged(document.getElementById("mTrack"), [t.artist, t.title].filter(Boolean).join(" — ") || "—");
        }
        return showResult.status === STATUS.OK || trackResult.status === STATUS.OK;
      }
      createPoller(refresh, REFRESH_MS.live).start();
    </script>
  </head>
  <body>
    <main class="sky-page">
      <div class="sky-page__inner">
        <img class="sky-page__logo" src="assets/media/brand/logo-320.jpg" alt="" width="84" height="84" />
        <h1 class="page-title">Le Chat Noir</h1>
        <p class="kicker">laboratoire radiophonique indépendant</p>

        <span class="onair-pill is-on">
          <span class="onair-pill__dot" aria-hidden="true"></span>
          <span>site en maintenance — l'antenne continue</span>
        </span>

        <p class="sky-page__lead">
          On bricole le site quelques instants. La radio, elle, ne s'arrête pas : le direct s'écoute ci-dessous.
        </p>

        <section class="maintenance-card" aria-label="Écouter le direct">
          <span class="kicker kicker--accent">// en ce moment</span>
          <p class="maintenance-card__show" id="mShow">Chargement…</p>
          <p class="status-line" id="mTrack">…</p>
          <audio class="maintenance-audio" controls preload="none">
            <source src="https://stream.lechatnoirradio.fr/stream.mp3" type="audio/mpeg" />
          </audio>
        </section>

        <p class="status-line">· le chat noir — retour imminent ·</p>
      </div>
    </main>
  </body>
</html>
