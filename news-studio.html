<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Studio Actualités — Le Chat Noir</title>
    <meta name="description" content="Outil de rédaction des actualités du Chat Noir : génère le Markdown à committer." />
    <meta name="theme-color" content="#f4eee0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14110d" media="(prefers-color-scheme: dark)" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/shell.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <script type="module" src="assets/js/page-news-studio.js"></script>
  </head>
  <body>
    <header class="top-shell">
      <div class="top-shell__inner" style="padding-bottom: 14px;">
        <div class="shell-head">
          <a class="brand" href="index.html" aria-label="Le Chat Noir — retour à l'accueil">
            <img class="brand__logo" src="assets/media/brand/logo-320.jpg" alt="" width="40" height="40" />
            <span>
              <span class="brand__name">Le Chat Noir</span>
              <span class="brand__sub">studio actualités</span>
            </span>
          </a>
          <a class="ghost-link" href="index.html">← retour à l'accueil</a>
        </div>
      </div>
    </header>

    <main class="site-main" style="max-width: 920px;">
      <p class="kicker kicker--accent" style="margin: 0 0 6px;">// outil du mainteneur</p>
      <h1 class="page-title">Studio Actualités</h1>
      <p class="page-lead">
        Rédigez ici, puis enregistrez le fichier Markdown dans <span class="mono">content/news/</span> et lancez
        <span class="mono">npm run build:news</span>.
      </p>

      <div class="studio-grid">
        <form id="newsStudioForm">
          <label class="field" style="margin-bottom: 14px;">
            <span class="kicker">titre</span>
            <input id="newsTitleInput" type="text" placeholder="Titre de l'actualité" />
          </label>
          <div style="display: flex; gap: 14px; margin-bottom: 14px;">
            <label class="field" style="flex: 1;">
              <span class="kicker">date de publication</span>
              <input id="newsDateInput" type="date" />
            </label>
            <label class="field" style="width: 110px;">
              <span class="kicker">ordre</span>
              <input id="newsOrderInput" type="number" min="1" max="59" value="1" />
            </label>
          </div>
          <label class="field" style="margin-bottom: 14px;">
            <span class="kicker">chapeau</span>
            <textarea id="newsLeadInput" rows="3" placeholder="Le chapeau de l'actualité (un paragraphe)."></textarea>
          </label>
          <label class="field">
            <span class="kicker">corps du billet</span>
            <textarea id="newsBodyInput" rows="8" placeholder="Le corps du billet. Markdown simple accepté, y compris [des liens](https://example.com)."></textarea>
          </label>
        </form>

        <div>
          <p class="status-line" style="margin: 0 0 4px;">slug : <span class="mono" id="newsSlugPreview">—</span></p>
          <p class="status-line" style="margin: 0 0 10px;">fichier : <span class="mono" id="newsFilePreview">—</span></p>
          <textarea id="newsMarkdownOutput" rows="16" readonly aria-label="Markdown généré"></textarea>
          <div class="history-actions">
            <button class="action-button" id="copyMarkdownButton" type="button">Copier le Markdown</button>
            <button class="action-button action-button--ghost" id="downloadMarkdownButton" type="button">Télécharger le fichier</button>
          </div>
        </div>
      </div>

      <section class="page-section" style="margin-top: 40px;" aria-labelledby="studio-recent-title">
        <div class="page-section__head">
          <h2 class="page-section__title" id="studio-recent-title">Dernières actualités générées</h2>
        </div>
        <div id="newsStudioRecent"><p class="status-line">chargement…</p></div>
      </section>
    </main>
  </body>
</html>
